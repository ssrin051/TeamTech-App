name: Flutter CI (Team Tech)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: solara

      - name: Build macOS
        run: flutter build macos
        working-directory: solara

      - name: Build web
        run: flutter build web
        working-directory: solara
